<!-- Notchlet app icon. The artwork is the same file the website serves as its
     favicon (notchlet-website/src/app/icon.svg); keep the two in sync by hand.

     The only difference is the viewBox. The website draws the squircle edge to
     edge, but macOS app icons sit on a grid where the rounded square fills
     824 of a 1024 canvas, leaving 100px of clear space on every side. Widening
     the viewBox to 1024/0.8046875 units and offsetting by half the surplus
     insets the artwork to that grid without touching the drawing itself.

     Render the asset catalog with Scripts/make-appicon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-124.36 -124.36 1272.73 1272.73" width="1024" height="1024">
  <title>Notchlet</title>
  <defs>
    <clipPath id="icon"><path d="M0,512 C0,71.7 71.7,0 512,0 C952.3,0 1024,71.7 1024,512 C1024,952.3 952.3,1024 512,1024 C71.7,1024 0,952.3 0,512 Z"/></clipPath>

    <!-- Background: vivid, lit from above -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CEBFF"/>
      <stop offset="0.5" stop-color="#1FB6E8"/>
      <stop offset="1" stop-color="#0A5A9C"/>
    </linearGradient>
    <radialGradient id="bgLight" cx="0.25" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgTopRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Black glass (the extended notch) -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050509"/>
      <stop offset="0.6" stop-color="#0C0C14"/>
      <stop offset="1" stop-color="#1B1A2E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#BFF1FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#CDF4FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerRefract" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#5FC8F0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7FDCFF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bottomBounce" cx="0.5" cy="1.1" r="0.55">
      <stop offset="0" stop-color="#3FBFF0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3FBFF0" stop-opacity="0"/>
    </radialGradient>

    <!-- Usage ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DF08A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>

    <filter id="dropShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
      <feOffset dy="40" result="b"/>
      <feFlood flood-color="#043457" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>

    <path id="glass" d="M128,-60 H896 V650 A130 130 0 0 1 766 780 H258 A130 130 0 0 1 128 650 Z"/>
    <clipPath id="glassClip"><path d="M128,-60 H896 V650 A130 130 0 0 1 766 780 H258 A130 130 0 0 1 128 650 Z"/></clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <!-- Background slab -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bgLight)"/>
    <rect width="1024" height="1024" fill="url(#bgTopRim)"/>


    <!-- The extended notch, as black glass -->
    <g filter="url(#dropShadow)">
      <use href="#glass" fill="url(#glassFill)"/>
    </g>
    <g clip-path="url(#glassClip)">
      <!-- thick refracted edge (glass thickness) -->
      <use href="#glass" fill="none" stroke="url(#innerRefract)" stroke-width="60"/>
      <!-- bounce of the background colour into the bottom of the glass -->
      <use href="#glass" fill="url(#bottomBounce)"/>
      <!-- top-left sheen -->
      <path d="M128 -60 H896 V60 C700 220 420 360 128 500 Z" fill="url(#sheen)" filter="url(#blur18)"/>
    </g>
    <!-- specular rim -->
    <use href="#glass" fill="none" stroke="url(#rim)" stroke-width="5"/>

    <!-- Usage ring -->
    <g transform="translate(512 430)" fill="none" stroke-linecap="round" stroke-width="46">
      <circle r="192" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle r="192" stroke="url(#ring)" stroke-dasharray="820 1206" transform="rotate(-90)" filter="url(#glow)"/>
    </g>
  </g>
</svg>
