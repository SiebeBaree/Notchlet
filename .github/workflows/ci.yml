name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch betterleaks
        run: ./Scripts/fetch-betterleaks.sh
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Notchlet.xcodeproj \
            -scheme Notchlet \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            | tail -100

  lint:
    name: SwiftFormat
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Lint
        run: swiftformat --lint .
